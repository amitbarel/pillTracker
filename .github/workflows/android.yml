name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # The signing key comes from repository secrets so every build can be
      # installed over the previous one. Without them, the build is signed
      # with a throwaway debug key.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PILL_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PILL_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          PILL_KEYSTORE_PASSWORD: ${{ secrets.PILL_KEYSTORE_PASSWORD }}
          PILL_KEY_ALIAS: ${{ secrets.PILL_KEY_ALIAS }}
          PILL_KEY_PASSWORD: ${{ secrets.PILL_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          mv build/app/outputs/flutter-apk/app-release.apk pill-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pill-tracker-apk
          path: pill-tracker.apk

      # Every build of main replaces the APK on the "latest" release, so the
      # download link for the phone never changes.
      - name: Publish to the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Pill Tracker (latest)" \
              --notes "Open this page on the phone and tap pill-tracker.apk to install or update."
          gh release upload latest pill-tracker.apk --clobber
